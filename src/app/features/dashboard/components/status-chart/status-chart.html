<div class="card border-0 shadow-sm h-100">

  <div class="card-body p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

      <div>
        <h5 class="fw-bold mb-1">{{ title }}</h5>
        <small class="text-muted">Status distribution</small>
      </div>

      <div class="bg-primary bg-opacity-10 rounded-3 p-3">
        <i class="bi bi-bar-chart-line text-primary fs-4"></i>
      </div>

    </div>

    @if (rows.length > 0) {

      @for (row of rows; track row.name) {

        <div class="mb-3">

          <div class="d-flex justify-content-between mb-2">

            <span class="small fw-semibold">
              {{ row.name }}
            </span>

            <span class="small text-muted">
              {{ row.count }} ({{ row.percentage.toFixed(1) }}%)
            </span>

          </div>

          <div
            class="progress"
            role="progressbar"
            [attr.aria-label]="row.name"
            [attr.aria-valuenow]="row.percentage"
            aria-valuemin="0"
            aria-valuemax="100"
            style="height: 10px;">

            <div
              class="progress-bar progress-bar-striped"
              [style.width.%]="row.percentage">
            </div>

          </div>

        </div>

      }

    } @else if (unavailable) {

      <div class="alert alert-warning mb-0">

        <i class="bi bi-exclamation-triangle me-2"></i>

        Service unavailable. Chart will appear when data is available.

      </div>

    } @else {

      <div class="text-center py-4">

        <i class="bi bi-bar-chart text-muted fs-1"></i>

        <p class="text-muted mt-3 mb-0">
          No status data available yet.
        </p>

      </div>

    }

  </div>

</div>
