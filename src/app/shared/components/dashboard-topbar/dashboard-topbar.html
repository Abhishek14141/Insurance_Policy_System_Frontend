
<header class="navbar navbar-light bg-white border-bottom px-3 py-3 shadow-sm">

  <div class="d-flex align-items-center gap-2">
    <i class="bi bi-shield-check text-primary fs-4"></i>

    <div>
      <h5 class="mb-0 fw-bold">Insurance Policy System</h5>
      <small class="text-muted">{{ role }} Portal</small>
    </div>
  </div>

  <div class="d-flex align-items-center gap-3">

    <a [routerLink]="homeUrl"
       class="text-decoration-none text-secondary"
       title="Dashboard">
      <i class="bi bi-house-door fs-5"></i>
    </a>

    <button type="button"
            class="btn btn-light position-relative"
            title="Notifications">
      <i class="bi bi-bell fs-5"></i>
    </button>

    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-person-circle fs-4 text-primary"></i>
      <span class="fw-semibold">{{ role }}</span>
    </div>

  </div>

</header>
