
<div class="mb-4">
  <h2 class="fw-bold mb-1">Agent Dashboard</h2>

  <p class="text-muted">
    Manage customers, quotations, policies and commissions.
  </p>
</div>

<div class="row g-4">

  @for (card of cards; track card.title) {

    <div class="col-12 col-md-6 col-xl-4">

      <div class="card shadow-sm border-0 h-100">

        <div class="card-body p-4">

          <i class="bi fs-2 text-primary"
             [class]="card.icon"></i>

          <h5 class="fw-semibold mt-3">
            {{ card.title }}
          </h5>

        </div>

      </div>

    </div>

  }

</div>
